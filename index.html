<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121211">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Charge — masse & PPL</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('charge-v1') || '{}');
      if (s.settings && s.settings.theme) document.documentElement.dataset.theme = s.settings.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="#/repas" aria-label="Charge, accueil">CHARGE</a>
      <span class="topbar-date" id="topbar-date"></span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="restbar" id="restbar" hidden aria-live="polite"></div>

  <nav class="tabbar" aria-label="Navigation principale">
    <div class="tabbar-in">
      <a href="#/repas" data-tab="repas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M7 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M17 7c0-1.5 1-2 1-3.5"/></svg>
        <span>Repas</span>
      </a>
      <a href="#/seance" data-tab="seance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>Séance</span>
      </a>
      <a href="#/poids" data-tab="poids">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8.5 9.5a5 5 0 0 1 7 0L13 12"/></svg>
        <span>Poids</span>
      </a>
      <a href="#/journal" data-tab="journal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>
        <span>Journal</span>
      </a>
    </div>
  </nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-in" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
